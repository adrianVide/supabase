# Supabase Docker Compose - Complete with Static IPs (Dokploy DNS workaround)
# ==========================
# 1️⃣ INSTANCE VARIABLES
# Modify these for each deployment
# ==========================
environment:
  SUBNET_THIRD_OCTET: 28
  PROJECT_NAME: supabase
  CONTAINER_PREFIX: default
  POSTGRES_PORT: 5432
  POOLER_PROXY_PORT_TRANSACTION: 6543
  KONG_HTTP_PORT: 8000
  KONG_HTTPS_PORT: 8443
  ANALYTICS_PORT: 4000
  POSTGRES_DB: supabase
  POSTGRES_PASSWORD: examplepassword
  JWT_SECRET: supersecretjwt
  JWT_EXPIRY: 3600
  ANON_KEY: exampleanonkey
  SERVICE_ROLE_KEY: exampleservicekey
  STUDIO_DEFAULT_ORGANIZATION: defaultorg
  STUDIO_DEFAULT_PROJECT: defaultproject
  OPENAI_API_KEY: ""
  SUPABASE_PUBLIC_URL: http://localhost:8000
  SITE_URL: http://localhost:8000
  API_EXTERNAL_URL: http://localhost:8000
  ADDITIONAL_REDIRECT_URLS: http://localhost:8000
  DISABLE_SIGNUP: "false"
  ENABLE_EMAIL_SIGNUP: "true"
  ENABLE_EMAIL_AUTOCONFIRM: "true"
  SMTP_ADMIN_EMAIL: admin@example.com
  SMTP_HOST: smtp.example.com
  SMTP_PORT: 587
  SMTP_USER: smtp_user
  SMTP_PASS: smtp_pass
  SMTP_SENDER_NAME: "Supabase"
  MAILER_URLPATHS_INVITE: /invite
  MAILER_URLPATHS_CONFIRMATION: /confirm
  MAILER_URLPATHS_RECOVERY: /recover
  MAILER_URLPATHS_EMAIL_CHANGE: /change
  ENABLE_PHONE_SIGNUP: "false"
  ENABLE_PHONE_AUTOCONFIRM: "false"
  SECRET_KEY_BASE: secretkeybase
  VAULT_ENC_KEY: vaultkey
  POOLER_TENANT_ID: tenant1
  POOLER_DEFAULT_POOL_SIZE: 20
  POOLER_MAX_CLIENT_CONN: 100
  POOLER_DB_POOL_SIZE: 10
  IMGPROXY_ENABLE_WEBP_DETECTION: "true"
  FUNCTIONS_VERIFY_JWT: "true"
  DOCKER_SOCKET_LOCATION: /var/run/docker.sock
  LOGFLARE_PUBLIC_ACCESS_TOKEN: examplepublictoken
  LOGFLARE_PRIVATE_ACCESS_TOKEN: exampleprivatetoken

networks:
  supabase:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.${SUBNET_THIRD_OCTET:-28}.0.0/16

services:

  init-backup-dirs:
    image: busybox:latest
    volumes:
      - /data/backups:/backups
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      CONTAINER_PREFIX: ${CONTAINER_PREFIX}
    command: >
      sh -c "
      echo 'Creating backup directory structure for: $${PROJECT_NAME}-$${CONTAINER_PREFIX}';
      mkdir -p /backups;
      mkdir -p /backups/$${PROJECT_NAME}-$${CONTAINER_PREFIX}/database;
      mkdir -p /backups/$${PROJECT_NAME}-$${CONTAINER_PREFIX}/storage;
      chown -R 999:999 /backups/$${PROJECT_NAME}-$${CONTAINER_PREFIX}/database 2>/dev/null || echo 'Note: Could not set database ownership (may need root on host)';
      chmod -R 700 /backups/$${PROJECT_NAME}-$${CONTAINER_PREFIX}/database 2>/dev/null || echo 'Note: Could not set database permissions (may need root on host)';
      echo 'Backup directories ready:';
      ls -la /backups/$${PROJECT_NAME}-$${CONTAINER_PREFIX}/ || echo 'Directory created but not yet visible';
      echo 'Init complete!'
      "
    restart: "no"

  studio:
    image: supabase/studio:2025.11.10-sha-5291fe3
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.29
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://studio:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      HOSTNAME: "::"
      STUDIO_PG_META_URL: http://172.${SUBNET_THIRD_OCTET:-28}.0.26:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: 172.${SUBNET_THIRD_OCTET:-28}.0.10
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://172.${SUBNET_THIRD_OCTET:-28}.0.28:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_API_KEY: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_URL: http://172.${SUBNET_THIRD_OCTET:-28}.0.20:4000
      NEXT_PUBLIC_ENABLE_LOGS: true
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.28
    ports:
      - ${KONG_HTTP_PORT}:8000/tcp
      - ${KONG_HTTPS_PORT}:8443/tcp
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      SUBNET_THIRD_OCTET: ${SUBNET_THIRD_OCTET:-28}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

  auth:
    image: supabase/gotrue:v2.182.1
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.21
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@172.${SUBNET_THIRD_OCTET:-28}.0.10:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    image: postgrest/postgrest:v13.0.7
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.22
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@172.${SUBNET_THIRD_OCTET:-28}.0.10:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgrest"
      ]

  realtime:
    # This container name looks inconsistent but is correct because realtime constructs tenant id by parsing the subdomain
    hostname: realtime-dev.${CONTAINER_PREFIX:-default}-realtime
    image: supabase/realtime:v2.63.0
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.23
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "-H",
          "Authorization: Bearer ${ANON_KEY}",
          "http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: 172.${SUBNET_THIRD_OCTET:-28}.0.10
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: true
      RUN_JANITOR: true

  storage:
    image: supabase/storage-api:v1.29.0
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.24
    volumes:
      - /data/backups/${PROJECT_NAME}-${CONTAINER_PREFIX:-default}/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://172.${SUBNET_THIRD_OCTET:-28}.0.24:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      init-backup-dirs:
        condition: service_completed_successfully
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://172.${SUBNET_THIRD_OCTET:-28}.0.22:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@172.${SUBNET_THIRD_OCTET:-28}.0.10:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      # TODO: https://github.com/supabase/storage-api/issues/55
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://172.${SUBNET_THIRD_OCTET:-28}.0.25:5001

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.25
    volumes:
      - /data/backups/${PROJECT_NAME}-${CONTAINER_PREFIX:-default}/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "imgproxy",
          "health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION}

  meta:
    image: supabase/postgres-meta:v0.93.1
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.26
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: 172.${SUBNET_THIRD_OCTET:-28}.0.10
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  functions:
    image: supabase/edge-runtime:v1.69.23
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.27
    volumes:
      - ./volumes/functions:/home/deno/functions:Z
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://172.${SUBNET_THIRD_OCTET:-28}.0.28:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@172.${SUBNET_THIRD_OCTET:-28}.0.10:${POSTGRES_PORT}/${POSTGRES_DB}
      # TODO: Allow configuring VERIFY_JWT per function. This PR might help: https://github.com/supabase/cli/pull/786
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT}"
    command:
      [
        "start",
        "--main-service",
        "/home/deno/functions/main"
      ]

  analytics:
    image: supabase/logflare:1.22.6
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.20
    ports:
      - ${ANALYTICS_PORT:-4000}:4000
    # Uncomment to use Big Query backend for analytics
    # volumes:
    #   - type: bind
    #     source: ${PWD}/gcloud.json
    #     target: /opt/app/rel/logflare/bin/gcloud.json
    #     read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "http://localhost:4000/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    links:
      - db
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      DB_USERNAME: supabase_admin
      DB_DATABASE: _supabase
      DB_HOSTNAME: 172.${SUBNET_THIRD_OCTET:-28}.0.10
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: _analytics
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_SINGLE_TENANT: true
      LOGFLARE_SUPABASE_MODE: true

      # Comment variables to use Big Query backend for analytics
      POSTGRES_BACKEND_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@172.${SUBNET_THIRD_OCTET:-28}.0.10:${POSTGRES_PORT}/_supabase
      POSTGRES_BACKEND_SCHEMA: _analytics
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true
      # Uncomment to use Big Query backend for analytics
      # GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      # GOOGLE_PROJECT_NUMBER: ${GOOGLE_PROJECT_NUMBER}

  # Comment out everything below this point if you are using an external Postgres database
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.10
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      # Must be superuser to create event trigger
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      # Must be superuser to alter reserved role
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      # Initialize the database settings with JWT_SECRET and JWT_EXP
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # PGDATA directory is persisted between restarts using bind mount
      - /data/backups/${PROJECT_NAME:-supabase}-${CONTAINER_PREFIX:-default}/database:/var/lib/postgresql/data:Z
      # Changes required for internal supabase data such as _analytics
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      # Changes required for Analytics support
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      # Changes required for Pooler support
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      # Use named volume to persist pgsodium decryption key between restarts
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        [
        "CMD",
        "pg_isready",
        "-U",
        "postgres",
        "-h",
        "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      init-backup-dirs:
        condition: service_completed_successfully
      vector:
        condition: service_healthy
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal" # prevents Realtime polling queries from appearing in logs
      ]

  vector:
    image: timberio/vector:0.28.1-alpine
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.11
    volumes:
      - ./volumes/logs/vector.yml:/etc/vector/vector.yml:ro,z
      - ${DOCKER_SOCKET_LOCATION}:/var/run/docker.sock:ro,z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9001/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    command:
      [
        "--config",
        "/etc/vector/vector.yml"
      ]
    security_opt:
      - "label=disable"

  # Update the DATABASE_URL if you are using an external Postgres database
  supavisor:
    image: supabase/supavisor:2.7.4
    restart: unless-stopped
    networks:
      supabase:
        ipv4_address: 172.${SUBNET_THIRD_OCTET:-28}.0.30
    ports:
      - ${POSTGRES_PORT}:5432
      - ${POOLER_PROXY_PORT_TRANSACTION}:6543
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@172.${SUBNET_THIRD_OCTET:-28}.0.10:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [
        "/bin/sh",
        "-c",
        "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]

volumes:
  db-config:
